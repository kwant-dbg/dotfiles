# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

symbol_map U+E000-U+E00A,U+E0A0-U+E0B4,U+E0AC,U+E0AF-U+E0B4,U+E0B6-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B5,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font

# Shell
shell zsh
shell_integration enabled

# Cursor
cursor_shape     beam
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Window
window_padding_width 0
hide_window_decorations no
confirm_os_window_close 0

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# Mellow dark theme
foreground            #c9c7cd
background            #161617
selection_foreground  #161617
selection_background  #c9c7cd

color0  #27272a
color8  #52525b
color1  #f5a191
color9  #f5a191
color2  #90b99f
color10 #90b99f
color3  #e6b99d
color11 #e6b99d
color4  #aca1cf
color12 #aca1cf
color5  #e29eca
color13 #e29eca
color6  #ea83a5
color14 #ea83a5
color7  #c9c7cd
color15 #f5f5f5

cursor            #aca1cf
cursor_text_color #161617

url_color #aca1cf
url_style curly

# Performance
repaint_delay   8
sync_to_monitor yes
