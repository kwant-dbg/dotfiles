set -g mouse on

setw -g mode-keys vi

# ── Prefix Key ──────────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -l 35% -c "#{pane_current_path}"

# ── Pane Navigation (vim-style, prefix-based) ─────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind '\' last-window

# ── vim-tmux-navigator (prefix-free C-h/j/k/l) ────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# ── Copy Mode Vi Bindings ─────────────────────────────────
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Wayland clipboard (wl-copy). On WSL, replace with: clip.exe
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
set -g set-clipboard on

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ── General ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/zsh
set -g detach-on-destroy off
set -ag terminal-overrides ",xterm-256color:RGB"
set -g escape-time 0
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ── Mellow Colors ────────────────────────────────────────────
bg0="#161617"
bg1="#1b1b1d"
bg2="#2a2a2d"
fg="#c9c7cd"
fg_dim="#757581"
blue="#aca1cf"
orange="#e6b99d"
green="#90b99f"
red="#f5a191"

# ── Status Bar ───────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=${bg1},fg=${fg}"

set -g status-left-length 40
set -g status-left "#[bg=${blue},fg=${bg0},bold]  #S #[bg=${bg1},fg=${blue}]"

set -g status-right-length 80
set -g status-right "#[fg=${fg_dim}] %a %d %b #[fg=${fg}] %I:%M %p #{?client_prefix,#[fg=${orange}] ^ ,}"

# ── Window Tabs ──────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-format " #[fg=${fg_dim}]#I #W #[fg=${bg2},bg=${bg1}]|"
set -g window-status-current-format "#[fg=${bg1},bg=${bg2}]#[fg=${fg},bg=${bg2},bold] #I #W #[fg=${bg2},bg=${bg1}]|"

# ── Pane Borders ─────────────────────────────────────────────
set -g pane-border-style "fg=${bg2}"
set -g pane-active-border-style "fg=${blue}"

# ── Message Bar ──────────────────────────────────────────────
set -g message-style "bg=${bg2},fg=${orange}"
set -g message-command-style "bg=${bg2},fg=${blue}"

# ── Plugins ──────────────────────────────────────────────────
run '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
