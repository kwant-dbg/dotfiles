set -g mouse on

setw -g mode-keys vi

# ── Prefix Key ──────────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix
unbind C-r
set -gu @resurrect-save-script-path
set -gu @resurrect-restore-script-path
set -gu @resurrect-strategy-irb
set -gu @resurrect-strategy-mosh-client
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -l 35% -c "#{pane_current_path}"
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# ── Pane Navigation (vim-style, prefix-based) ─────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind '\' last-window

# ── vim-tmux-navigator (prefix-free C-h/j/k/l) ────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
# ── Copy Mode Vi Bindings ─────────────────────────────────
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy keyboard and mouse selections to the native system clipboard.
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'set -g @clipboard-command "pbcopy"' \
    'set -g @clipboard-command "clip.exe"'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@clipboard-command}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "#{@clipboard-command}"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# ── General ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"

# Truecolor: the outer terminal reports as xterm-ghostty, not xterm-256color,
# so the override has to target that termname to actually take effect.
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Undercurl + colored underlines (Ghostty supports both; the bundled
# tmux-256color terminfo entry doesn't advertise them by default, so LSP
# diagnostic squiggles fall back to a plain underline without this).
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Forward pane/application titles (e.g. nvim's current filename) to Ghostty's
# tab/window title.
set -g set-titles on
set -g set-titles-string "#T"

set -g escape-time 0
set -g history-limit 10000
#set -g mouse on
set -g base-index 1
set -g pane-base-index 1

# ── Timezone ─────────────────────────────────────────────────
# set-environment -g TZ "Asia/Kolkata"

# ── Mellow Colors (status line only) ──────────────────────────
bg0="#1c1c1e"
bg1="#252528"
bg2="#303034"
fg="#c9c7cd"
fg_dim="#92909a"
blue="#aca1cf"
orange="#e6b99d"

# Renumber Windows
set -g renumber-windows on

# ── Status Bar ───────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=${bg1},fg=${fg}"
# ── Left: Session name ───────────────────────────────────────
set -g status-left-length 40
set -g status-left "#[bg=${bg2},fg=${fg_dim}]  #S #[bg=${bg1},fg=${bg2}]"

# ── Right: Date | Time | Host ────────────────────────────────
set -g status-right-length 80
set -g status-right "#[fg=${fg_dim}] %a %d %b #[fg=${fg}] %I:%M %p #{?client_prefix,#[fg=${orange}] ^ ,}"

# ── Window Tabs ──────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-format " #[fg=${fg_dim}]#I #W #[fg=${bg2},bg=${bg1}]|"
set -g window-status-current-format "#[bg=${blue},fg=${bg0},bold] #I #W #[fg=${blue},bg=${bg1}]|"

# ── Pane Borders ─────────────────────────────────────────────
set -g pane-border-lines single

set -g focus-events on

# Forward escape sequences from the running app straight through to Ghostty
# instead of tmux consuming them. Screenshot drag-and-drop (unlike a plain
# Finder file drop) hands Ghostty a "promised" item it has to resolve first,
# which plausibly emits sequences tmux swallows by default — try toggling
# this off if it causes unrelated issues.
set -g allow-passthrough on

bind b break-pane -d
bind g join-pane -s !
