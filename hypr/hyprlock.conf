# ═══════════════════════════════
# Minimal Monochrome — Hyprlock
# ═══════════════════════════════

general {
    grace = 5
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    color = rgba(0f0f0fee)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrains Mono Nerd Font Thin
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A  %B %d")"
    color = rgba(255, 255, 255, 0.35)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 40
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(20, 20, 20, 1.0)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##555555">password</span>
    rounding = 0
    check_color = rgba(255, 255, 255, 0.5)
    fail_color = rgba(255, 85, 85, 0.8)
    fail_text = <span foreground="##ff5555">$FAIL</span>
    fail_transition = 200
    position = 0, -60
    halign = center
    valign = center
}
