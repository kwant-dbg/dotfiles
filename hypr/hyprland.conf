################
### MONITORS ###
################

# BenQ 1440p (top) over USB-C/DisplayPort — 144Hz, 125% scale
monitor = DP-1, 2560x1440@144, 0x0, 1.25

# Laptop display (bottom, centered under BenQ) at 1.25x scale
# BenQ logical: 2048x1152 — laptop logical width: 1536 — x offset: 256
monitor = eDP-1, 1920x1080@60, 256x1152, 1.25

# Fallback for any other monitors
monitor = , preferred, auto, 1


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,16
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,16
env = HYPRCURSOR_THEME,Adwaita

# Wayland-native toolkits
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


#################
### AUTOSTART ###
#################

exec = sh -c "pgrep -x waybar >/dev/null || waybar"
exec = ~/.config/hypr/start-hyprpaper.sh
exec-once = hypridle
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Fix slow GTK app startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


#####################
### LOOK AND FEEL ###
#####################

# Minimal monochrome palette
$accent   = rgb(ffffff)
$inactive = rgb(2a2a2a)
$bg       = rgb(0f0f0f)

general {
    gaps_in = 4
    gaps_out = 4

    border_size = 1

    col.active_border = $accent
    col.inactive_border = $inactive

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = snap, 0.19, 1, 0.22, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 2, snap, slide
    animation = windowsIn, 1, 2, snap, slide
    animation = windowsOut, 1, 1, snap, slide
    animation = windowsMove, 1, 2, snap
    animation = border, 1, 3, linear
    animation = fade, 1, 2, snap
    animation = workspaces, 1, 2, snap, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
    vfr = true
}

xwayland {
    force_zero_scaling = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
        scroll_factor = 1.0
    }
}

# Flat accel = no acceleration curve (raw speed), slight slowdown
device {
    name = logitech-g304-1
    accel_profile = flat
    sensitivity = -0.15
}

device {
    name = liteon-dell-wireless-device-mouse
    accel_profile = flat
    sensitivity = -0.35
}

device {
    name = asue120b:00-04f3:31c0-touchpad
    accel_profile = adaptive
    sensitivity = 0.1
    natural_scroll = true
    tap-to-click = true
    scroll_factor = 0.3
}

gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun -I -a

bind = $mainMod, F1, exec, hyprctl dispatch moveworkspacetomonitor 1 eDP-1
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, xdg-open about:blank
bind = $mainMod, TAB, exec, hyprctl dispatch hyprexpo:expo toggle

bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, O, layoutmsg, togglesplit
bind = $mainMod, M, exec, hyprctl dispatch exit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

binde = $mainMod CTRL, left, resizeactive, -30 0
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, up, resizeactive, 0 -30
binde = $mainMod CTRL, down, resizeactive, 0 30

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , Print, exec, grim -g "$(slurp -d)" - | wl-copy
bind = $mainMod, Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp -d)" ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

bind = $mainMod, period, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, X, exec, hyprlock

bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = float-dialogs
    match:title = (Open File|Save File|File Upload|Select|Choose|dialog|Confirm|About|Preferences|Settings)
    float = true
    size = 60% 60%
    center = true
}

windowrule {
    name = float-popups
    match:class = ^(pavucontrol|nm-connection-editor|blueman-manager)$
    float = true
    size = 50% 50%
    center = true
}

windowrule {
    name = float-polkit
    match:class = ^(org.kde.polkit-kde-authentication-agent-1)$
    float = true
    center = true
}

windowrule {
    name = float-picture-in-picture
    match:title = ^(Picture-in-Picture|Picture in Picture)$
    float = true
    pin = true
    size = 25% 25%
    move = 73% 72%
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 0.95 0.88
}
